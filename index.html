<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moon</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<main>

    <!-- 首頁 -->
    <section id="home-screen">

        <div class="moon">🌙</div>

        <h1>Moon</h1>

        <p class="subtitle">
            今晚想停留一下嗎
        </p>

        <button id="enterBtn">
            我在
        </button>

    </section>


    <!-- 接住頁 -->
    <section id="welcome-screen" class="hidden">

        <div class="moon small">🌙</div>

        <h2>今晚</h2>

        <p class="subtitle">
            不用急著說話<br>
            先待一會就好
        </p>

        <button id="continueBtn">
            繼續
        </button>

    </section>
    <!-- 小燈塔介紹頁 -->
    <section id="intro-screen" class="hidden">

        <div class="moon small">🌙</div>

        <h2>小燈塔</h2>

        <p class="subtitle">
            這裡沒有一定要做的事<br>
            只是為偶爾路過的人<br>
            留了一點光
        </p>

        <button id="exploreBtn">
            四處看看
        </button>

    </section>
        <!-- 小燈塔主空間 -->
    <section id="world-screen" class="hidden">

        <div class="moon small">🌙</div>

        <h2>今晚的燈還亮著</h2>

        <p class="subtitle">
            想往哪裡走<br>
            都可以
        </p>

        <div class="path-list">

            <button id="moonPathBtn">
                看看月亮
            </button>

            <button id="starsPathBtn">
                看看星光
            </button>

            <button id="lighthousePathBtn">
                走近燈塔
            </button>

        </div>

    </section>
        <!-- 月亮頁 -->
    <section id="moon-screen" class="hidden">

        <div class="moon">🌙</div>

        <h2>今晚的月亮</h2>

        <p class="subtitle">
            它沒有催你往前<br>
            只是陪你看一會
        </p>

        <button id="backFromMoonBtn">
            回到燈塔
        </button>

    </section>
        <!-- 星光頁 -->
    <section id="stars-screen" class="hidden">

        <div class="moon">✦</div>

        <h2>看看星光</h2>

        <p class="subtitle">
            有些光不需要被看懂<br>
            只要知道它曾經亮過
        </p>

        <button id="backFromStarsBtn">
            回到燈塔
        </button>

    </section>
    <!-- 燈塔頁 -->
<section id="lighthouse-screen" class="hidden">

    <div class="moon">燈</div>

    <h2>燈塔裡</h2>

    <p class="subtitle">
        這裡收著一些光<br>
        有些照向遠方<br>
        有些只是安靜地亮著
    </p>

    <button id="backFromLighthouseBtn">
        回到燈塔
    </button>

</section>
</main>

<script src="data/cards.js"></script>
<script src="js/script.js"></script>

</body>

</html>
